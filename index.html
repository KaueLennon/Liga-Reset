<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liga Reset 2026</title>
<style>
:root{
  --bg:#f6f4f1; --surface:#ffffff; --surface-2:#f2eee9; --text:#1d1b19; --muted:#6d665e; --border:#e4ded6;
  --accent:#d9601a; --accent-ink:#ffffff; --accent-soft:#fbe7d8;
  --win:#1e8449; --win-soft:#ddf1e4; --lose:#c0392b; --lose-soft:#f8dfdc; --warn:#a86b00; --warn-soft:#fff1cf;
  --gold:#c99a06; --silver:#8d97a4; --bronze:#b06a35;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131110; --surface:#1c1917; --surface-2:#262220; --text:#f2ede7; --muted:#a69d93; --border:#36302b;
    --accent:#f07a2e; --accent-ink:#1a0d04; --accent-soft:#3b2414;
    --win:#4cc27e; --win-soft:#16301f; --lose:#ef6b5f; --lose-soft:#3a1b18; --warn:#f0b43c; --warn-soft:#3a2c0e;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131110; --surface:#1c1917; --surface-2:#262220; --text:#f2ede7; --muted:#a69d93; --border:#36302b;
  --accent:#f07a2e; --accent-ink:#1a0d04; --accent-soft:#3b2414;
  --win:#4cc27e; --win-soft:#16301f; --lose:#ef6b5f; --lose-soft:#3a1b18; --warn:#f0b43c; --warn-soft:#3a2c0e;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top-in{max-width:1200px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;font-weight:800}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.bar{width:140px;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
nav.tabs{max-width:1200px;margin:0 auto;padding:8px 16px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
nav.tabs a:hover{color:var(--text)}
nav.tabs a.on{color:var(--text);border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.sec{margin-top:26px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--win-soft);color:var(--win)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.team{display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:100%}
.team .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .tc{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esc{position:relative;flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);overflow:hidden}
.esc img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.esc.lg{width:40px;height:40px;font-size:15px}
.tbd{color:var(--muted);font-style:italic}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
th.l,td.l{text-align:left}
td.t{text-align:left;max-width:240px;white-space:normal}
tr:last-child td{border-bottom:0}
td.pos{width:28px;color:var(--muted);font-weight:600}
tr.z-q td.pos{color:var(--win)}
tr.z-r td.pos{color:var(--accent)}
tr.z-g td.pos{color:var(--gold)}
tr.out td{opacity:.55}
tr.me{background:var(--accent-soft)}
.tw{overflow-x:auto;margin:0 -2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.match{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.match:last-child{border-bottom:0}
.match .h{justify-self:end;text-align:right}
.match .h .team{flex-direction:row-reverse}
.match .sc{font-weight:600;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.match .x{color:var(--muted);font-size:12px}
.match .w{color:var(--win)}
.match .l{color:var(--muted);font-weight:500}
@media (max-width:560px){.match{grid-template-columns:1fr auto auto auto 1fr;gap:4px}.match .sc{min-width:44px}.match .tn{max-width:92px}}
.rsel{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.rsel button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums}
.rsel button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rsel button.fut{color:var(--muted)}
.bracket{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:250px;flex:1}
.bcol .bc{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bcol h3{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:0}
.mm{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mm-h{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:5px 9px;background:var(--surface-2)}
.mm-r{display:grid;grid-template-columns:1fr 46px 46px 54px;gap:4px;align-items:center;padding:6px 9px;font-variant-numeric:tabular-nums}
.mm-r+.mm-r{border-top:1px solid var(--border)}
.mm-r span.v{text-align:right;color:var(--muted);font-size:12px}
.mm-r span.ag{text-align:right;font-weight:700}
.mm-r.win{background:var(--win-soft)}
.mm-r.win span.ag{color:var(--win)}
.mm-r.lose .tn{opacity:.6}
.mm-lab{display:grid;grid-template-columns:1fr 46px 46px 54px;gap:4px;padding:3px 9px 0;font-size:10px;color:var(--muted);text-align:right}
.mm-lab span:first-child{text-align:left}
.mm-note{font-size:11px;padding:4px 9px;background:var(--warn-soft);color:var(--warn)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.comp{display:flex;flex-direction:column;gap:10px}
.comp .ttl{display:flex;align-items:center;gap:8px}
.comp .ttl b{font-size:15px}
.comp .who{display:flex;align-items:center;gap:10px}
.medal{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}.m4{background:var(--muted)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--lose)}
textarea{width:100%;min-height:140px;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
input[type=number],select{border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:6px 8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:4px 16px;margin-top:10px}
.sgrid label{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dashed var(--border)}
.sgrid label .team{flex:1}
.sgrid input{width:80px;text-align:right}
.sgrid input.miss{border-color:var(--warn);background:var(--warn-soft)}
.note{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--win-soft);color:var(--win)}
.rules td,.rules th{white-space:normal;text-align:left;vertical-align:top}
.rules td:first-child{font-weight:600}
.rules ul{margin:0;padding-left:16px}
details>summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:8px}
.r1list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px}
.r1i{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.r1i .sp{min-width:0}
.r1i.out{opacity:.5}
.r1i.champ{border-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

  }
  function rankSum(a, b, key, label, prizes, done){
    const rows = D.times.map(t => { let s = 0, n = 0; for (let r = a; r <= b; r++){ const v = P(r,t.id); if (v != null){ s += v; n++; } } return {id:t.id, pts:s, n}; });
    const pf = pref(key);
    rows.sort((x,y) => c2(y.pts)-c2(x.pts) || pf(x.id,y.id) || COLL.compare(nm(x.id), nm(y.id)));
    rows.forEach((x,i) => x.pos = i+1);
    if (done) for (let i = 0; i < prizes && i+1 < rows.length; i++){
      if (c2(rows[i].pts) === c2(rows[i+1].pts)){
        ties.push({key, label, options: rows.filter(x => c2(x.pts) === c2(rows[i].pts)).map(x => x.id), chosen: dz[key] ?? null});
        break;
      }
    }
    return rows;
  }
  function leg2(key, label, a, b, r1, r2){
    const m = {key, label, a, b, r1, r2, a1:P(r1,a), b1:P(r1,b), a2:P(r2,a), b2:P(r2,b), w:null, l:null};
    if (a == null || b == null) return m;
    if (m.a1 != null && m.b1 != null){ m.aggA = m.a1 + (m.a2 ?? 0); m.aggB = m.b1 + (m.b2 ?? 0); }
    if ([m.a1,m.b1,m.a2,m.b2].every(v => v != null)){
      const d = c2(m.aggA) - c2(m.aggB);
      if (d > 0){ m.w = a; m.l = b; }
      else if (d < 0){ m.w = b; m.l = a; }
      else {
        m.tie = true; const z = dz[key];
        ties.push({key, label: label + " — agregado empatado", options:[a,b], chosen: z ?? null});
        if (z === a || z === b){ m.w = z; m.l = z === a ? b : a; }
      }
    }
    return m;
  }

  /* Bootcamp (1–5) */
  const boot = {done: allHave(1,5)};
  boot.table = rankSum(1, 5, "bootcamp", "Bootcamp — empate na zona de premiação", D.premios.bootcamp.length, boot.done);
  const bootRank = new Map(boot.table.map(x => [x.id, x.pos]));

  /* Copa Reset — fase de grupos (6–11) */
  const grupos = Object.entries(D.grupos).map(([L, ids]) => {
    const matches = GT.flatMap((pairs, i) => pairs.map(([x,y]) => mk(6+i, ids[x], ids[y])));
    const tab = table(ids, matches, id => bootRank.get(id) || 99);
    const done = matches.every(m => m.res);
    return {L, ids, matches, table: tab, done};
  });
  const gDone = grupos.every(g => g.done);
  const first = {}, second = {};
  grupos.forEach(g => { if (g.done){ first[g.L] = g.table[0].id; second[g.L] = g.table[1].id; } });

  /* Copa Reset — mata-mata */
  const J = {};
  OITAVAS.forEach(([x,y], i) => { J[i+1] = leg2("copa-j"+(i+1), "Copa Reset · Oitavas · Jogo "+(i+1), first[x] ?? null, second[y] ?? null, 12, 13); J[i+1].seedA = "1º "+x; J[i+1].seedB = "2º "+y; });
  [[9,3,4],[10,1,2],[11,7,8],[12,5,6]].forEach(([n,a,b]) => { J[n] = leg2("copa-j"+n, "Copa Reset · Quartas · Jogo "+n, J[a].w, J[b].w, 14, 15); J[n].seedA = "Venc. J"+a; J[n].seedB = "Venc. J"+b; });
  [[13,9,10],[14,11,12]].forEach(([n,a,b]) => { J[n] = leg2("copa-j"+n, "Copa Reset · Semifinal · Jogo "+n, J[a].w, J[b].w, 16, 17); J[n].seedA = "Venc. J"+a; J[n].seedB = "Venc. J"+b; });
  J[15] = leg2("copa-j15", "Copa Reset · Final", J[13].w, J[14].w, 18, 19); J[15].seedA = "Venc. J13"; J[15].seedB = "Venc. J14";
  J[16] = leg2("copa-j16", "Copa Reset · 3º lugar", J[13].l, J[14].l, 18, 19); J[16].seedA = "Perd. J13"; J[16].seedB = "Perd. J14";
  const copa = {grupos, gDone, J, podium:[J[15].w, J[15].l, J[16].w, J[16].l], done: !!(J[15].w && J[16].w)};
  const oitavasDone = [1,2,3,4,5,6,7,8].every(n => J[n].w);

  /* Resta 1 (12–19) */
  const r1 = {participants: [], rounds: [], elim: [], champion: null, aliveAfter: {}};
  if (gDone){
    r1.participants = grupos.flatMap(g => [g.table[2].id, g.table[3].id]);
    let alive = [...r1.participants];
    for (let r = 12; r <= 19 && alive.length > 1; r++){
      if (!has(r)) break;
      const key = "resta1-r"+r, pf = pref(key);
      const n = alive.length === 2 ? 1 : 2;
      const rows = alive.map(id => ({id, p: P(r,id) ?? 0, miss: P(r,id) == null}));
      rows.sort((a,b) => c2(b.p)-c2(a.p) || pf(a.id,b.id) || COLL.compare(nm(a.id), nm(b.id)));
      const cut = rows.length - n;
      if (c2(rows[cut-1].p) === c2(rows[cut].p)){
        ties.push({key, label:"Resta 1 · Rodada "+r+" — empate na zona de eliminação (escolha quem se salva)", options: rows.filter(x => c2(x.p) === c2(rows[cut].p)).map(x => x.id), chosen: dz[key] ?? null});
      }
      rows.forEach((x,i) => { x.out = i >= cut; x.rank = i+1; });
      r1.rounds.push({r, rows});
      rows.slice(cut).forEach(x => r1.elim.push({id:x.id, r, p:x.p}));
      alive = rows.slice(0, cut).map(x => x.id);
      r1.aliveAfter[r] = alive;
    }
    r1.alive = alive;
    if (alive.length === 1) r1.champion = alive[0];
    // ranking: vivos primeiro, depois eliminados da rodada mais recente para a mais antiga
    const byR = {}; r1.elim.forEach(e => (byR[e.r] = byR[e.r] || []).push(e));
    r1.ranking = [...alive.map(id => ({id, alive:true}))];
    Object.keys(byR).map(Number).sort((a,b) => b-a).forEach(r => byR[r].forEach(e => r1.ranking.push({id:e.id, r, p:e.p})));
  }
  r1.done = !!r1.champion;
  r1.vice = r1.done ? r1.ranking[1].id : null;

  /* Hard Reset e Backup (20–34) */
  function liga(key, ids, ordemFixa){
    const L = {key, ids, started: ids.length === 16};
    if (!L.started) return L;
    let ord = ordemFixa && ordemFixa.length === 16 && ordemFixa.every(id => ids.includes(id)) ? ordemFixa.slice() : ids.slice().sort((a,b) => COLL.compare(nm(a), nm(b)));
    L.ord = ord;
    L.rounds = D.turnoUnico.map((pairs, i) => ({r: 20+i, matches: pairs.map(([x,y]) => mk(20+i, ord[x-1], ord[y-1]))}));
    L.table = table(ord, L.rounds.flatMap(x => x.matches), id => ord.indexOf(id));
    L.done = L.rounds.every(x => x.matches.every(m => m.res));
    return L;
  }
  const r15 = r1.aliveAfter[15];
  const formed = !!(r15 && oitavasDone);
  const hrIds = formed ? [...r15, ...[1,2,3,4,5,6,7,8].map(n => J[n].w)] : [];
  const bkIds = formed ? [...r1.elim.filter(e => e.r <= 15).map(e => e.id), ...[1,2,3,4,5,6,7,8].map(n => J[n].l)] : [];
  const hr = liga("hardReset", hrIds, (D.ordem||{}).hardReset);
  const bk = liga("backup", bkIds, (D.ordem||{}).backup);

  /* Final Boss (35–38) */
  const fb = {};
  fb.s1 = leg2("fb-s1", "Final Boss · Semi 1", copa.done ? J[15].w : null, bk.done ? bk.table[0].id : null, 35, 36);
  fb.s1.seedA = "Campeão Copa Reset"; fb.s1.seedB = "Campeão Backup";
  fb.s2 = leg2("fb-s2", "Final Boss · Semi 2", r1.champion, hr.done ? hr.table[0].id : null, 35, 36);
  fb.s2.seedA = "Campeão Resta 1"; fb.s2.seedB = "Campeão Hard Reset";
  fb.f = leg2("fb-final", "Final Boss · Finalíssima", fb.s1.w, fb.s2.w, 37, 38); fb.f.seedA = "Venc. Semi 1"; fb.f.seedB = "Venc. Semi 2";
  fb.t = leg2("fb-3", "Final Boss · 3º lugar", fb.s1.l, fb.s2.l, 37, 38); fb.t.seedA = "Perd. Semi 1"; fb.t.seedB = "Perd. Semi 2";
  fb.done = !!(fb.f.w && fb.t.w);
  fb.podium = [fb.f.w, fb.f.l, fb.t.w, fb.t.l];

  /* Reset Supremo e Overdrive (1–38) */
  const supDone = allHave(1, TOTAL_RODADAS);
  const sup = {done: supDone, table: rankSum(1, TOTAL_RODADAS, "supremo", "Reset Supremo — empate no 1º lugar", 1, supDone)};
  const all = [];
  for (const r of rounds) for (const t of D.times){ const v = P(r, t.id); if (v != null) all.push({r, id:t.id, p:v}); }
  const pfo = pref("overdrive");
  all.sort((a,b) => c2(b.p)-c2(a.p) || pfo(a.id,b.id) || a.r-b.r);
  const od = {done: supDone, top: all.slice(0, 15)};
  if (supDone && all.length > 1 && c2(all[0].p) === c2(all[1].p) && all[0].id !== all[1].id)
    ties.push({key:"overdrive", label:"Overdrive — empate na maior pontuação", options:[...new Set(all.filter(x => c2(x.p) === c2(all[0].p)).map(x => x.id))], chosen: dz.overdrive ?? null});

  /* Premiação */
  const PR = D.premios;
  const pz = (vals, ids) => vals.map((v,i) => ({pos:i+1, id: ids[i] ?? null, v}));
  const premiacao = [
    {k:"bootcamp", nome:"Bootcamp", done: boot.done, rows: pz(PR.bootcamp, boot.table.map(x => x.id))},
    {k:"copa", nome:"Copa Reset", done: copa.done, rows: pz(PR.copa, copa.podium)},
    {k:"resta1", nome:"Resta 1", done: r1.done, rows: pz(PR.resta1, [r1.champion, r1.vice])},
    {k:"hardReset", nome:"Hard Reset", done: !!hr.done, rows: pz(PR.hardReset, hr.started ? hr.table.map(x => x.id) : [])},
    {k:"backup", nome:"Backup", done: !!bk.done, rows: pz(PR.backup, bk.started ? bk.table.map(x => x.id) : [])},
    {k:"finalBoss", nome:"Final Boss", done: fb.done, rows: pz(PR.finalBoss, fb.podium)},
    {k:"supremo", nome:"Reset Supremo", done: sup.done, rows: pz(PR.supremo, sup.table.map(x => x.id))},
    {k:"overdrive", nome:"Overdrive", done: od.done, rows: pz(PR.overdrive, od.top.map(x => x.id))},
  ];
  const ganhos = new Map();
  premiacao.filter(c => c.done).forEach(c => c.rows.forEach(x => { if (x.id != null) ganhos.set(x.id, (ganhos.get(x.id)||0) + x.v); }));

  return {T, P, has, rounds, last, ties, boot, copa, r1, hr, bk, fb, sup, od, premiacao, ganhos, nm};
}

/* ---------------- utilidades de interface ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = v => v == null ? "–" : (+v).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtS = v => (v > 0 ? "+" : "") + fmt(v);
const brl = v => (+v).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600); }
function escudo(id, lg){
  const t = M.T.get(id); if (!t) return "";
  const ini = esc((t.nome.replace(/[^A-Za-zÀ-ÿ0-9]/g,"")[0] || "?").toUpperCase());
  return `<span class="esc${lg ? " lg" : ""}">${ini}${t.escudo ? `<img src="${esc(t.escudo)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}</span>`;
}
function team(id, o = {}){
  if (id == null) return `<span class="tbd">${esc(o.tbd || "A definir")}</span>`;
  const t = M.T.get(id); if (!t) return esc(id);
  return `<span class="team">${escudo(id, o.lg)}<span style="min-width:0"><span class="tn">${esc(t.nome)}</span>${o.cartola ? `<span class="tc">${esc(t.cartola)}</span>` : ""}</span></span>`;
}
const medal = p => `<span class="medal m${Math.min(p,4)}">${p}</span>`;
function status(done, started, extra){
  if (done) return `<span class="pill done">Encerrado</span>`;
  if (started) return `<span class="pill live">${extra || "Em andamento"}</span>`;
  return `<span class="pill">Aguardando</span>`;
}
document.addEventListener("error", e => { if (e.target && e.target.tagName === "IMG" && e.target.parentNode && e.target.parentNode.classList.contains("esc")) e.target.remove(); }, true);

/* ---------------- componentes ---------------- */
function matchRow(m){
  const cls = side => !m.res ? "" : (m.res === "E" ? "" : (m.res === side ? "w" : "l"));
  return `<div class="match">
    <div class="h">${team(m.h)}</div>
    <div class="sc ${cls("H")}">${fmt(m.hp)}</div><div class="x">x</div><div class="sc ${cls("A")}">${fmt(m.ap)}</div>
    <div>${team(m.a)}</div></div>`;
}
function standings(rows, o = {}){
  const zone = o.zone || (() => "");
  return `<div class="tw"><table class="num"><thead><tr><th></th><th class="l">Time</th><th>PG</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>GP</th>${o.pct ? "<th>%</th>" : ""}</tr></thead><tbody>
  ${rows.map(x => `<tr class="${zone(x)}"><td class="pos">${x.pos}</td><td class="t">${team(x.id)}</td><td><b>${x.PG}</b></td><td>${x.J}</td><td>${x.V}</td><td>${x.E}</td><td>${x.D}</td><td>${fmtS(x.SG)}</td><td>${fmt(x.GP)}</td>${o.pct ? `<td>${Math.round(x.pct*100)}%</td>` : ""}</tr>`).join("")}
  </tbody></table></div>`;
}
function mmCard(m, title){
  const rodadas = `R${m.r1} · R${m.r2}`;
  const row = (id, v1, v2, ag, seed) => {
    const st = m.w == null ? "" : (m.w === id ? "win" : "lose");
    return `<div class="mm-r ${st}"><span style="min-width:0">${team(id, {tbd: seed})}</span><span class="v">${fmt(v1)}</span><span class="v">${fmt(v2)}</span><span class="ag">${id == null || v1 == null ? "" : fmt(ag)}</span></div>`;
  };
  const note = m.tie && m.w == null ? `<div class="mm-note">Empate no agregado — defina o sorteio na aba Atualizar</div>` : (m.tie ? `<div class="mm-note">Decidido no sorteio</div>` : "");
  return `<div class="mm"><div class="mm-h"><span>${esc(title)}</span><span>${rodadas}</span></div>
    <div class="mm-lab"><span></span><span>Ida</span><span>Volta</span><span>Agreg.</span></div>
    ${row(m.a, m.a1, m.a2, m.aggA, m.seedA)}${row(m.b, m.b1, m.b2, m.aggB, m.seedB)}${note}</div>`;
}
function roundSelector(name, from, to, cur){
  let h = `<div class="rsel" data-rsel="${name}">`;
  for (let r = from; r <= to; r++) h += `<button data-r="${r}" class="${r === cur ? "on" : ""} ${M.has(r) ? "" : "fut"}">${r}</button>`;
  return h + "</div>";
}
const UI = {};
function curRound(name, from, to){
  if (UI[name] && UI[name] >= from && UI[name] <= to) return UI[name];
  let r = from; for (let x = from; x <= to; x++) if (M.has(x)) r = x;
  if (M.last >= from && M.last < to && !M.has(r)) r = M.last;
  return r;
}

const byName = () => { const m = new Map(); D.times.forEach(t => m.set(norm(t.nome), t.id)); return m; };
function norm(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim(); }
function parsePaste(txt){
  const ids = new Set(D.times.map(t => t.id)), names = byName();
  const res = new Map(), unknown = [];
  for (const line of txt.split(/\r?\n/)){
    if (!line.trim()) continue;
    let cells = line.split("\t");
    if (cells.length < 2) cells = line.split(";");
    if (cells.length < 2) cells = line.trim().split(/\s{2,}/);
    cells = cells.map(c => c.trim());
    let id = null;
    for (const c of cells) if (/^\d+$/.test(c) && ids.has(+c)){ id = +c; break; }
    if (id == null) for (const c of cells){ const x = names.get(norm(c)); if (x){ id = x; break; } }
    let pts = null;
    for (let i = cells.length-1; i >= 0; i--){
      const c = cells[i].replace(/\s/g, "");
      if (/^-?\d+([.,]\d+)?$/.test(c) && !(id != null && +c === id)){ pts = parseFloat(c.replace(",", ".")); break; }
    }
    if (id != null && pts != null) res.set(id, Math.round(pts*100)/100);
    else if (!/rodada|timeid|pontos/i.test(line)) unknown.push(line);
  }
  return {res, unknown};
}

function lerGrade(){
  const o = {}; let n = 0;
  document.querySelectorAll("#sgrid input").forEach(i => {
    const v = i.value.trim().replace(/\s/g, "").replace(",", ".");
    if (v !== "" && !isNaN(+v)){ o[i.dataset.id] = Math.round(+v*100)/100; n++; }
  });
  return {o, n};
}

async function importarXlsx(file){
  toast("Lendo planilha…");
  if (!window.XLSX){
    await new Promise((ok, err) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = () => err(new Error("Sem conexão para carregar o leitor de planilhas")); document.head.appendChild(s); });
  }
  const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
  const sn = wb.SheetNames.find(n => norm(n) === "pontuacao") || wb.SheetNames.find(n => /pontua/i.test(norm(n)));
  if (!sn) throw new Error("Aba Pontuação não encontrada");
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
  const hi = rows.findIndex(r => r && r.some(c => norm(c) === "rodada") && r.some(c => norm(c) === "timeid"));
  if (hi < 0) throw new Error("Cabeçalho Rodada/timeId não encontrado");
  const h = rows[hi].map(norm);
  const cR = h.indexOf("rodada"), cI = h.indexOf("timeid"), cP = h.lastIndexOf("pontos");
  const ids = new Set(D.times.map(t => t.id));
  const out = {};
  for (const r of rows.slice(hi+1)){
    if (!r) continue;
    const rd = parseInt(r[cR]), id = parseInt(r[cI]);
    let p = r[cP]; if (typeof p === "string") p = parseFloat(p.replace(",", "."));
    if (!rd || !ids.has(id) || p == null || isNaN(p)) continue;
    (out[rd] = out[rd] || {})[id] = Math.round(p*100)/100;
  }
  const n = Object.keys(out).length;
  if (!n) throw new Error("Nenhuma pontuação encontrada");
  let changed = 0;
  for (const [rd, m] of Object.entries(out)){
    if (JSON.stringify(m) !== JSON.stringify((BASE.pontuacoes || {})[rd] || null)){ LOCAL.pontuacoes[rd] = m; changed++; }
    else delete LOCAL.pontuacoes[rd];
  }
  saveLocal(); refresh();
  toast(`${n} rodadas lidas · ${changed} com novidades`);
}

function baixar(){
  const data = JSON.parse(JSON.stringify(D));
  data.atualizadoEm = new Date().toISOString();
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  const html = SOURCE.replace(/(<script id="liga-dados" type="application\/json">)[\s\S]*?(<\/script>)/, (_, a, b) => a + json + b);
  const blob = new Blob([html], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (D.nome || "Liga") + ".html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Arquivo gerado — substitua o HTML antigo por ele");
}

document.addEventListener("click", e => {
  const rb = e.target.closest("[data-rsel] button");
  if (rb){ UI[rb.parentNode.dataset.rsel] = +rb.dataset.r; draw(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "baixar") baixar();
  if (act === "limpar"){ if (confirm("Descartar todas as alterações feitas neste navegador?")){ LOCAL = {pontuacoes:{}, desempates:{}}; saveLocal(); refresh(); toast("Alterações locais descartadas"); } }
  if (act === "ler"){
    const {res, unknown} = parsePaste($("#paste").value);
    document.querySelectorAll("#sgrid input").forEach(i => { const v = res.get(+i.dataset.id); if (v != null) i.value = String(v).replace(".", ","); i.classList.toggle("miss", v == null); });
    $("#pmsg").innerHTML = `${res.size} de ${D.times.length} times reconhecidos` + (unknown.length ? ` · <span style="color:var(--warn)">${unknown.length} linha(s) não reconhecida(s): ${esc(unknown.slice(0,3).join(" | "))}</span>` : "");
  }
  if (act === "salvar"){
    const {o, n} = lerGrade(); const r = UI.editR;
    if (!n){ toast("Nenhuma pontuação preenchida"); return; }
    if (n < D.times.length && !confirm(`Só ${n} de ${D.times.length} times têm pontuação. Salvar assim mesmo?`)) return;
    LOCAL.pontuacoes[r] = o; saveLocal(); refresh(); toast(`Rodada ${r} salva`);
  }
  if (act === "copiar"){
    const r = UI.editR, sc = D.pontuacoes[r] || {};
    const linhas = D.times.filter(t => sc[t.id] != null).sort((a,b) => sc[b.id]-sc[a.id])
      .map(t => [r, t.id, t.nome, t.cartola, (+sc[t.id]).toFixed(2)].join("\t"));
    navigator.clipboard.writeText(linhas.join("\n")).then(() => toast(`Rodada ${r} copiada — cole na coluna B da aba Pontuação`), () => toast("Não foi possível copiar"));
  }
  if (act === "excluir"){ const r = UI.editR; if (confirm(`Excluir as pontuações da rodada ${r}?`)){ LOCAL.pontuacoes[r] = null; saveLocal(); refresh(); toast(`Rodada ${r} excluída`); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "editR"){ UI.editR = Math.max(1, Math.min(TOTAL_RODADAS, +t.value || 1)); draw(); }
  if (t.dataset.act === "xlsx" && t.files[0]){ importarXlsx(t.files[0]).catch(err => toast(err.message)); t.value = ""; }
  if (t.dataset.tie){ LOCAL.desempates[t.dataset.tie] = t.value ? +t.value : null; if (!t.value && !(t.dataset.tie in (BASE.desempates||{}))) delete LOCAL.desempates[t.dataset.tie]; saveLocal(); refresh(); }
});
window.addEventListener("hashchange", draw);

function tab(){ const h = location.hash.slice(1); return TABS.some(t => t[0] === h) ? h : "inicio"; }
function draw(){
  const t = tab();
  $("#nav").innerHTML = TABS.map(([k, n]) => `<a href="#${k}" class="${k === t ? "on" : ""}">${n}${k === "atualizar" && M.ties.some(x => x.chosen == null) ? " •" : ""}</a>`).join("");
  $("#main").innerHTML = V[t]();
}
function refresh(){
  merge(); M = compute(D);
  document.title = D.nome; $("#ttl").textContent = D.nome;
  $("#progtxt").textContent = `Rodada ${M.last}/${TOTAL_RODADAS}`;
  $("#progbar").style.width = (M.last / TOTAL_RODADAS * 100) + "%";
  draw();
}
refresh();
</script>
</body>
</html>
