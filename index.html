<style>
:root{
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#f0f2f6; --surface-3:#e6e9ef; --border:#e2e5eb;
  --text:#11141b; --muted:#5d6676; --faint:#8a92a1;
  --accent:#e85d0c; --accent-2:#ff8a3d; --accent-soft:#fdeadd; --accent-ink:#ffffff;
  --cyan:#0b9fc2; --win:#14904f; --win-soft:#dcf3e6; --lose:#cf3b2e; --warn:#a46a00; --warn-soft:#fff2d1;
  --gold:#d6a313; --gold-soft:#fbf1d2; --silver:#9aa3b0; --bronze:#bd7438;
  --side-bg:#ffffff; --shadow:0 1px 2px rgba(16,20,30,.04),0 6px 20px rgba(16,20,30,.06); --shadow-sm:0 1px 2px rgba(16,20,30,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c11; --surface:#12151c; --surface-2:#191d26; --surface-3:#222734; --border:#252a36;
    --text:#eef0f5; --muted:#98a0b1; --faint:#6c7486;
    --accent:#ff7a1f; --accent-2:#ffa25c; --accent-soft:rgba(255,122,31,.13); --accent-ink:#160a02;
    --cyan:#38c6e6; --win:#47c98a; --win-soft:rgba(71,201,138,.13); --lose:#f2685c; --warn:#f2b544; --warn-soft:rgba(242,181,68,.13);
    --gold:#f2c443; --gold-soft:rgba(242,196,67,.12); --silver:#b7bfcc; --bronze:#d58b4f;
    --side-bg:#0e1117; --shadow:0 1px 0 rgba(255,255,255,.02) inset; --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c11; --surface:#12151c; --surface-2:#191d26; --surface-3:#222734; --border:#252a36;
  --text:#eef0f5; --muted:#98a0b1; --faint:#6c7486;
  --accent:#ff7a1f; --accent-2:#ffa25c; --accent-soft:rgba(255,122,31,.13); --accent-ink:#160a02;
  --cyan:#38c6e6; --win:#47c98a; --win-soft:rgba(71,201,138,.13); --lose:#f2685c; --warn:#f2b544; --warn-soft:rgba(242,181,68,.13);
  --gold:#f2c443; --gold-soft:rgba(242,196,67,.12); --silver:#b7bfcc; --bronze:#d58b4f;
  --side-bg:#0e1117; --shadow:0 1px 0 rgba(255,255,255,.02) inset; --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px 16px}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 18px;text-decoration:none}
.brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--accent),0 6px 18px rgba(232,93,12,.35)}
.brand b{display:block;font:600 21px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted)}
.nav .grp{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;margin:1px 0;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;padding-top:18px;display:grid;gap:12px}
.meter{padding:12px;border-radius:12px;background:var(--surface-2)}
.meter .row1{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter .row1 b{color:var(--text);font-family:var(--display);font-size:15px;letter-spacing:.02em}
.meter .bar{height:6px;border-radius:9px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.meter small{display:block;margin-top:8px;font-size:11px;color:var(--faint)}
.theme{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px}
.theme button{border:0;background:transparent;border-radius:8px;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:500}
.theme button svg{width:15px;height:15px}
.theme button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

.sec{margin-top:34px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}

.pill.live{background:var(--accent-soft);color:var(--accent)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
.pill.done{background:var(--win-soft);color:var(--win)}

.team{display:flex;align-items:center;gap:9px;min-width:0}

.tbd{color:var(--faint);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.m1{background:linear-gradient(135deg,#f6d365,#d6a313)}.m2{background:linear-gradient(135deg,#d7dde6,#9aa3b0)}.m3{background:linear-gradient(135deg,#e8a874,#bd7438)}.m4{background:var(--faint)}

table{border-collapse:collapse;width:100%}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}

.tw{overflow-x:auto}

.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.match{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}

.ch{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);text-decoration:none;min-width:0;transition:border-color .15s,transform .15s}

.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:12px;padding-top:6px}

/* ---------- chaveamento ---------- */
.bracket{container-type:inline-size;position:relative;border-radius:24px;padding:24px 20px 20px;color:#eef2ff;overflow:hidden;
  --bk-line:rgba(170,190,255,.28);
  background:
    radial-gradient(60% 50% at 50% 0%,rgba(56,198,230,.22),transparent 70%),
    radial-gradient(50% 45% at 100% 100%,rgba(255,122,31,.22),transparent 70%),
    radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 70% 15%,rgba(255,255,255,.45),transparent),
    radial-gradient(1px 1px at 85% 60%,rgba(255,255,255,.35),transparent),
    radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.4),transparent),
    linear-gradient(160deg,#0d1838 0%,#070c21 55%,#05081a 100%)}

.tcol{display:flex;flex-direction:column;min-width:0}
.th{text-align:center;font:600 12px var(--display);text-transform:uppercase;letter-spacing:.16em;color:rgba(220,228,255,.6);padding-bottom:12px}
.tb{flex:1;display:flex;flex-direction:column}

.bm{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.11);border-radius:13px;overflow:hidden;transition:border-color .15s,background .15s}

.thero .kick{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.thero h1{font:700 clamp(28px,4vw,42px)/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:4px 0 12px;word-break:break-word}
.thero select{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 10px;max-width:260px}
.thero select option{color:#111}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.kpi .v{font:600 24px/1.2 var(--display);letter-spacing:.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .grid line{stroke:var(--border)}
.chart text{fill:var(--faint);font-size:11px;font-family:var(--font)}
.chart .bar{fill:var(--accent)}
.chart .bar.dim{opacity:.35}
.chart .avg{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round;stroke-dasharray:5 4}
.chart .lbl{fill:var(--text);font-weight:600;font-size:11px}
.chart .hit{fill:transparent;cursor:pointer}
.chart .tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s;z-index:2}
.chart .tip b{font-family:var(--display);font-size:14px;letter-spacing:.02em}
.ckey{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.ckey i{display:inline-block;vertical-align:middle;margin-right:6px}
.ckey .kb{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.ckey .kl{width:18px;border-top:2px dashed var(--muted)}
.camp{display:grid;gap:4px}
.cp{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);min-width:0}
.cp:last-child{border-bottom:0}
.cp .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.cp.won .ic{background:var(--gold-soft);color:var(--gold)}
.cp .bd{flex:1;min-width:0}
.cp .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.cp .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
.cp .path{margin-top:6px;display:grid;gap:3px}
.cp .path div{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);min-width:0}
.cp .path .r{font-weight:700;width:16px;text-align:center}
.cp .path .r.v{color:var(--win)}.cp .path .r.d{color:var(--lose)}.cp .path .r.e{color:var(--warn)}
.cp .path .team{flex:1}.cp .path .team .tn{font-weight:500}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.picks button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.picks button:hover{border-color:var(--accent)}
.res{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-size:11px;font-weight:700;color:#fff;flex:none}
.res.v{background:var(--win)}.res.d{background:var(--lose)}.res.e{background:var(--warn)}.res.f{background:var(--surface-3);color:var(--muted)}

/* ---------- regras / admin ---------- */
.rules td,.rules th{white-space:normal;text-align:left;vertical-align:top}
.rules td:first-child{font-weight:600}
.rules ul{margin:0;padding:0;list-style:none}
.rules td.prem{white-space:nowrap;min-width:150px}
.rules td.prem li{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.rules td.prem li b{font-weight:600}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--lose)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
textarea{width:100%;min-height:140px;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:9px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
input[type=number],input[type=text],select{border:1px solid var(--border);border-radius:9px;background:var(--bg);padding:6px 8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:4px 18px;margin-top:10px}
.sgrid label{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--border);min-width:0}
.sgrid label .team{flex:1}
.sgrid input{width:84px;text-align:right}
.sgrid input.miss{border-color:var(--warn);background:var(--warn-soft)}
.note{padding:11px 13px;border-radius:12px;background:var(--surface-2);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--win-soft);color:var(--win)}
details>summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:10px;font-weight:500}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>

<script>
"use strict";
// Fonte original da página (usada para gerar o HTML atualizado com os dados embutidos)
const SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
const BASE = JSON.parse(document.getElementById("liga-dados").textContent);
const LS_KEY = "ligaReset:" + BASE.temporada;
const THEME_KEY = "ligaReset:tema";
const TOTAL_RODADAS = 38;
const LOGO = document.querySelector('link[rel="icon"]').href;
document.querySelectorAll("img[data-logo]").forEach(i => i.src = LOGO);

/* ---------------- regras fixas do formato ---------------- */
// Fase de grupos (rodadas 6–11): posições 0..3 = pote 1..4
const GT = [[[0,1],[2,3]],[[1,2],[3,0]],[[0,2],[1,3]],[[2,0],[3,1]],[[0,3],[2,1]],[[1,0],[3,2]]];
// Oitavas: 1º do grupo x 2º do grupo
const OITAVAS = [["A","B"],["C","D"],["E","F"],["G","H"],["B","A"],["D","C"],["F","E"],["H","G"]];
const COLL = new Intl.Collator("pt-BR", {sensitivity:"base"});
const c2 = x => Math.round(x * 100);

/* ---------------- dados locais (alterações ainda não gravadas no arquivo) ---------------- */
function loadLocal(){
  try { const v = JSON.parse(localStorage.getItem(LS_KEY)); if (v && typeof v === "object") return {pontuacoes:v.pontuacoes||{}, desempates:v.desempates||{}}; } catch(e){}
  return {pontuacoes:{}, desempates:{}};
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); } catch(e){ toast("Não foi possível salvar no navegador"); } }
let LOCAL = loadLocal();
let D, M;
function merge(){
  D = JSON.parse(JSON.stringify(BASE));
  D.pontuacoes = D.pontuacoes || {};
  D.desempates = D.desempates || {};
  for (const [r, v] of Object.entries(LOCAL.pontuacoes)) { if (v === null) delete D.pontuacoes[r]; else D.pontuacoes[r] = v; }
  for (const [k, v] of Object.entries(LOCAL.desempates)) { if (v === null) delete D.desempates[k]; else D.desempates[k] = v; }
}
function localCount(){ return Object.keys(LOCAL.pontuacoes).length + Object.keys(LOCAL.desempates).length; }

/* ---------------- motor de cálculo ---------------- */
function compute(D){
  const T = new Map(D.times.map(t => [t.id, t]));
  const SC = D.pontuacoes;
  const dz = D.desempates;
  const has = r => !!SC[r] && Object.keys(SC[r]).length > 0;
  const P = (r, id) => { const m = SC[r]; if (!m || id == null) return null; const v = m[id]; return v == null ? null : +v; };
  const rounds = Object.keys(SC).map(Number).filter(has).sort((a,b) => a-b);
  const last = rounds.length ? rounds[rounds.length-1] : 0;
  const nm = id => (T.get(id) || {}).nome || String(id);
  const ties = [];
  const pref = (key) => (a, b) => { const z = dz[key]; return a === z ? -1 : b === z ? 1 : 0; };
  const allHave = (a, b) => { for (let r = a; r <= b; r++) if (!has(r)) return false; return true; };

  const mk = (r, h, a) => {
    const m = {r, h, a, hp: P(r,h), ap: P(r,a), res: null};
    if (m.hp != null && m.ap != null) { const d = c2(m.hp) - c2(m.ap); m.res = d > 0 ? "H" : d < 0 ? "A" : "E"; }
    return m;
  };
  function table(ids, matches, tb){
    const s = new Map(ids.map(id => [id, {id, J:0, V:0, E:0, D:0, PG:0, GP:0, GC:0}]));
    for (const m of matches){
      if (!m.res) continue;
      const H = s.get(m.h), A = s.get(m.a);
      H.J++; A.J++; H.GP += m.hp; H.GC += m.ap; A.GP += m.ap; A.GC += m.hp;
      if (m.res === "H"){ H.V++; A.D++; H.PG += 3; } else if (m.res === "A"){ A.V++; H.D++; A.PG += 3; } else { H.E++; A.E++; H.PG++; A.PG++; }
    }
    const arr = [...s.values()];
    arr.forEach(x => { x.SG = x.GP - x.GC; x.pct = x.J ? x.PG / (x.J*3) : 0; });
    arr.sort((a,b) => b.PG-a.PG || b.V-a.V || c2(b.SG)-c2(a.SG) || c2(b.GP)-c2(a.GP) || tb(a.id)-tb(b.id));
    arr.forEach((x,i) => x.pos = i+1);
    return arr;
  }
  function rankSum(a, b, key, label, prizes, done){
    const rows = D.times.map(t => { let s = 0, n = 0; for (let r = a; r <= b; r++){ const v = P(r,t.id); if (v != null){ s += v; n++; } } return {id:t.id, pts:s, n}; });
    const pf = pref(key);
    rows.sort((x,y) => c2(y.pts)-c2(x.pts) || pf(x.id,y.id) || COLL.compare(nm(x.id), nm(y.id)));
    rows.forEach((x,i) => x.pos = i+1);
    if (done) for (let i = 0; i < prizes && i+1 < rows.length; i++){
      if (c2(rows[i].pts) === c2(rows[i+1].pts)){
        ties.push({key, label, options: rows.filter(x => c2(x.pts) === c2(rows[i].pts)).map(x => x.id), chosen: dz[key] ?? null});
        break;
      }
    }
    return rows;
  }
  function leg2(key, label, a, b, r1, r2){
    const m = {key, label, a, b, r1, r2, a1:P(r1,a), b1:P(r1,b), a2:P(r2,a), b2:P(r2,b), w:null, l:null};
    if (a == null || b == null) return m;
    if (m.a1 != null && m.b1 != null){ m.aggA = m.a1 + (m.a2 ?? 0); m.aggB = m.b1 + (m.b2 ?? 0); }
    if ([m.a1,m.b1,m.a2,m.b2].every(v => v != null)){
      const d = c2(m.aggA) - c2(m.aggB);
      if (d > 0){ m.w = a; m.l = b; }
      else if (d < 0){ m.w = b; m.l = a; }
      else {
        m.tie = true; const z = dz[key];
        ties.push({key, label: label + " — agregado empatado", options:[a,b], chosen: z ?? null});
        if (z === a || z === b){ m.w = z; m.l = z === a ? b : a; }
      }
    }
    return m;
  }

  /* Bootcamp (1–5) */
  const boot = {done: allHave(1,5)};
  boot.table = rankSum(1, 5, "bootcamp", "Bootcamp — empate na zona de premiação", D.premios.bootcamp.length, boot.done);
  const bootRank = new Map(boot.table.map(x => [x.id, x.pos]));

  /* Copa Reset — fase de grupos (6–11) */
  const grupos = Object.entries(D.grupos).map(([L, ids]) => {
    const matches = GT.flatMap((pairs, i) => pairs.map(([x,y]) => mk(6+i, ids[x], ids[y])));
    const tab = table(ids, matches, id => bootRank.get(id) || 99);
    const done = matches.every(m => m.res);
    return {L, ids, matches, table: tab, done};
  });
  const gDone = grupos.every(g => g.done);
  const first = {}, second = {};
  grupos.forEach(g => { if (g.done){ first[g.L] = g.table[0].id; second[g.L] = g.table[1].id; } });

  /* Copa Reset — mata-mata */
  const J = {};
  OITAVAS.forEach(([x,y], i) => { J[i+1] = leg2("copa-j"+(i+1), "Copa Reset · Oitavas · Jogo "+(i+1), first[x] ?? null, second[y] ?? null, 12, 13); J[i+1].seedA = "1º "+x; J[i+1].seedB = "2º "+y; });
  [[9,3,4],[10,1,2],[11,7,8],[12,5,6]].forEach(([n,a,b]) => { J[n] = leg2("copa-j"+n, "Copa Reset · Quartas · Jogo "+n, J[a].w, J[b].w, 14, 15); J[n].seedA = "Venc. J"+a; J[n].seedB = "Venc. J"+b; });
  [[13,9,10],[14,11,12]].forEach(([n,a,b]) => { J[n] = leg2("copa-j"+n, "Copa Reset · Semifinal · Jogo "+n, J[a].w, J[b].w, 16, 17); J[n].seedA = "Venc. J"+a; J[n].seedB = "Venc. J"+b; });
  J[15] = leg2("copa-j15", "Copa Reset · Final", J[13].w, J[14].w, 18, 19); J[15].seedA = "Venc. J13"; J[15].seedB = "Venc. J14";
  J[16] = leg2("copa-j16", "Copa Reset · 3º lugar", J[13].l, J[14].l, 18, 19); J[16].seedA = "Perd. J13"; J[16].seedB = "Perd. J14";
  const copa = {grupos, gDone, J, podium:[J[15].w, J[15].l, J[16].w, J[16].l], done: !!(J[15].w && J[16].w)};
  const oitavasDone = [1,2,3,4,5,6,7,8].every(n => J[n].w);

  /* Resta 1 (12–19) */
  const r1 = {participants: [], rounds: [], elim: [], champion: null, aliveAfter: {}};
  if (gDone){
    r1.participants = grupos.flatMap(g => [g.table[2].id, g.table[3].id]);
    let alive = [...r1.participants];
    for (let r = 12; r <= 19 && alive.length > 1; r++){
      if (!has(r)) break;
      const key = "resta1-r"+r, pf = pref(key);
      const n = alive.length === 2 ? 1 : 2;
      const rows = alive.map(id => ({id, p: P(r,id) ?? 0, miss: P(r,id) == null}));
      rows.sort((a,b) => c2(b.p)-c2(a.p) || pf(a.id,b.id) || COLL.compare(nm(a.id), nm(b.id)));
      const cut = rows.length - n;
      if (c2(rows[cut-1].p) === c2(rows[cut].p)){
        ties.push({key, label:"Resta 1 · Rodada "+r+" — empate na zona de eliminação (escolha quem se salva)", options: rows.filter(x => c2(x.p) === c2(rows[cut].p)).map(x => x.id), chosen: dz[key] ?? null});
      }
      rows.forEach((x,i) => { x.out = i >= cut; x.rank = i+1; });
      r1.rounds.push({r, rows});
      rows.slice(cut).forEach(x => r1.elim.push({id:x.id, r, p:x.p}));
      alive = rows.slice(0, cut).map(x => x.id);
      r1.aliveAfter[r] = alive;
    }
    r1.alive = alive;
    if (alive.length === 1) r1.champion = alive[0];
    // ranking: vivos primeiro, depois eliminados da rodada mais recente para a mais antiga
    const byR = {}; r1.elim.forEach(e => (byR[e.r] = byR[e.r] || []).push(e));
    r1.ranking = [...alive.map(id => ({id, alive:true}))];
    Object.keys(byR).map(Number).sort((a,b) => b-a).forEach(r => byR[r].forEach(e => r1.ranking.push({id:e.id, r, p:e.p})));
  }
  r1.done = !!r1.champion;
  r1.vice = r1.done ? r1.ranking[1].id : null;

  /* Hard Reset e Backup (20–34) */
  function liga(key, ids, ordemFixa){
    const L = {key, ids, started: ids.length === 16};
    if (!L.started) return L;
    let ord = ordemFixa && ordemFixa.length === 16 && ordemFixa.every(id => ids.includes(id)) ? ordemFixa.slice() : ids.slice().sort((a,b) => COLL.compare(nm(a), nm(b)));
    L.ord = ord;
    L.rounds = D.turnoUnico.map((pairs, i) => ({r: 20+i, matches: pairs.map(([x,y]) => mk(20+i, ord[x-1], ord[y-1]))}));
    L.table = table(ord, L.rounds.flatMap(x => x.matches), id => ord.indexOf(id));
    L.done = L.rounds.every(x => x.matches.every(m => m.res));
    return L;
  }
  const r15 = r1.aliveAfter[15];
  const formed = !!(r15 && oitavasDone);
  const hrIds = formed ? [...r15, ...[1,2,3,4,5,6,7,8].map(n => J[n].w)] : [];
  const bkIds = formed ? [...r1.elim.filter(e => e.r <= 15).map(e => e.id), ...[1,2,3,4,5,6,7,8].map(n => J[n].l)] : [];
  const hr = liga("hardReset", hrIds, (D.ordem||{}).hardReset);
  const bk = liga("backup", bkIds, (D.ordem||{}).backup);

  /* Final Boss (35–38) */
  const fb = {};
  fb.s1 = leg2("fb-s1", "Final Boss · Semi 1", copa.done ? J[15].w : null, bk.done ? bk.table[0].id : null, 35, 36);
  fb.s1.seedA = "Campeão Copa Reset"; fb.s1.seedB = "Campeão Backup";
  fb.s2 = leg2("fb-s2", "Final Boss · Semi 2", r1.champion, hr.done ? hr.table[0].id : null, 35, 36);
  fb.s2.seedA = "Campeão Resta 1"; fb.s2.seedB = "Campeão Hard Reset";
  fb.f = leg2("fb-final", "Final Boss · Finalíssima", fb.s1.w, fb.s2.w, 37, 38); fb.f.seedA = "Venc. Semi 1"; fb.f.seedB = "Venc. Semi 2";
  fb.t = leg2("fb-3", "Final Boss · 3º lugar", fb.s1.l, fb.s2.l, 37, 38); fb.t.seedA = "Perd. Semi 1"; fb.t.seedB = "Perd. Semi 2";
  fb.done = !!(fb.f.w && fb.t.w);
  fb.podium = [fb.f.w, fb.f.l, fb.t.w, fb.t.l];

  /* Reset Supremo e Overdrive (1–38) */
  const supDone = allHave(1, TOTAL_RODADAS);
  const sup = {done: supDone, table: rankSum(1, TOTAL_RODADAS, "supremo", "Reset Supremo — empate no 1º lugar", 1, supDone)};
  const all = [];
  for (const r of rounds) for (const t of D.times){ const v = P(r, t.id); if (v != null) all.push({r, id:t.id, p:v}); }
  const pfo = pref("overdrive");
  all.sort((a,b) => c2(b.p)-c2(a.p) || pfo(a.id,b.id) || a.r-b.r);
  const od = {done: supDone, top: all.slice(0, 15)};
  if (supDone && all.length > 1 && c2(all[0].p) === c2(all[1].p) && all[0].id !== all[1].id)
    ties.push({key:"overdrive", label:"Overdrive — empate na maior pontuação", options:[...new Set(all.filter(x => c2(x.p) === c2(all[0].p)).map(x => x.id))], chosen: dz.overdrive ?? null});

  /* Premiação */
  const PR = D.premios;
  const pz = (vals, ids) => vals.map((v,i) => ({pos:i+1, id: ids[i] ?? null, v}));
  const premiacao = [
    {k:"bootcamp", nome:"Bootcamp", done: boot.done, rows: pz(PR.bootcamp, boot.table.map(x => x.id))},
    {k:"copa", nome:"Copa Reset", done: copa.done, rows: pz(PR.copa, copa.podium)},
    {k:"resta1", nome:"Resta 1", done: r1.done, rows: pz(PR.resta1, [r1.champion, r1.vice])},
    {k:"hardReset", nome:"Hard Reset", done: !!hr.done, rows: pz(PR.hardReset, hr.started ? hr.table.map(x => x.id) : [])},
    {k:"backup", nome:"Backup", done: !!bk.done, rows: pz(PR.backup, bk.started ? bk.table.map(x => x.id) : [])},
    {k:"finalBoss", nome:"Final Boss", done: fb.done, rows: pz(PR.finalBoss, fb.podium)},
    {k:"supremo", nome:"Reset Supremo", done: sup.done, rows: pz(PR.supremo, sup.table.map(x => x.id))},
    {k:"overdrive", nome:"Overdrive", done: od.done, rows: pz(PR.overdrive, od.top.map(x => x.id))},
  ];
  const ganhos = new Map();
  premiacao.filter(c => c.done).forEach(c => c.rows.forEach(x => { if (x.id != null) ganhos.set(x.id, (ganhos.get(x.id)||0) + x.v); }));

  return {T, P, has, rounds, last, ties, boot, copa, r1, hr, bk, fb, sup, od, premiacao, ganhos, nm};
}

/* ---------------- seu time ---------------- */
const TIME_KEY = "ligaReset:time";
function timeSel(){
  const h = location.hash.slice(1).split("/");
  let id = h[0] === "time" && h[1] ? +h[1] : null;
  if (!id){ try { id = +localStorage.getItem(TIME_KEY) || null; } catch(e){} }
  return M.T.has(id) ? id : null;
}
function escolherTime(id){ try { localStorage.setItem(TIME_KEY, id); } catch(e){} location.hash = "#time/" + id; }
function perfil(id){
  const rounds = M.rounds.map(r => {
    const vals = D.times.map(t => M.P(r, t.id)).filter(v => v != null);
    const p = M.P(r, id), avg = vals.reduce((s, v) => s + v, 0) / vals.length;
    return {r, p, avg, n: vals.length, rank: p == null ? null : 1 + vals.filter(v => c2(v) > c2(p)).length};
  });
  const jog = rounds.filter(x => x.p != null);
  const total = jog.reduce((s, x) => s + x.p, 0);
  return {rounds, jog, total, media: jog.length ? total / jog.length : 0,
    best: jog.reduce((a, x) => !a || x.p > a.p ? x : a, null), worst: jog.reduce((a, x) => !a || x.p < a.p ? x : a, null),
    mitadas: jog.filter(x => x.rank === 1).length, acima: jog.filter(x => x.p > x.avg).length,
    rankMedio: jog.length ? jog.reduce((s, x) => s + x.rank, 0) / jog.length : null,
    sup: M.sup.table.find(x => x.id === id)};
}
const FASES = {1:"Oitavas",2:"Oitavas",3:"Oitavas",4:"Oitavas",5:"Oitavas",6:"Oitavas",7:"Oitavas",8:"Oitavas",9:"Quartas",10:"Quartas",11:"Quartas",12:"Quartas",13:"Semifinal",14:"Semifinal",15:"Final",16:"3º lugar"};
function resIcon(m, id){
  if (m.w == null) return `<span class="r">·</span>`;
  return m.w === id ? `<span class="r v">V</span>` : `<span class="r d">D</span>`;
}
function campanha(id){
  const out = [];
  const pill = (c, s) => `<span class="pill ${c}">${s}</span>`;
  const b = M.boot.table.find(x => x.id === id);
  out.push({k:"bootcamp", nome:"Bootcamp", won: M.boot.done && b.pos <= 4,
    st: !M.boot.done ? pill("live","Em andamento") : b.pos <= 4 ? pill("gold", b.pos + "º lugar") : b.pos <= 8 ? pill("done","Cabeça de chave") : "",
    t2: `${b.pos}º de 32 · ${fmt(b.pts)} pts`});
  const g = M.copa.grupos.find(x => x.ids.includes(id)), gp = g.table.find(x => x.id === id), J = M.copa.J;
  const path = []; for (let n = 1; n <= 16; n++) if (J[n].a === id || J[n].b === id) path.push(n);
  let st = "", won = false;
  if (!g.done) st = pill("live", "Fase de grupos");
  else if (gp.pos > 2) st = pill("", "Eliminado nos grupos");
  else if (path.length){
    const n = path[path.length - 1], m = J[n];
    if (n === 15 && m.w != null){ won = m.w === id; st = won ? pill("gold","Campeão") : pill("gold","Vice-campeão"); }
    else if (n === 16 && m.w != null){ won = m.w === id; st = pill(won ? "gold" : "", m.w === id ? "3º lugar" : "4º lugar"); }
    else if (m.l === id) st = pill("", "Eliminado · " + FASES[n]);
    else st = pill("live", FASES[n]);
  }
  out.push({k:"copa", nome:"Copa Reset", won, st,
    t2: `Grupo ${g.L}: ${gp.pos}º · ${gp.PG} pts (${gp.V}V ${gp.E}E ${gp.D}D) · saldo ${fmtS(gp.SG)}`,
    path: path.map(n => { const m = J[n], eu = m.a === id, adv = eu ? m.b : m.a; const a = eu ? m.aggA : m.aggB, o = eu ? m.aggB : m.aggA;
      return `<div>${resIcon(m, id)}<span style="width:70px;flex:none">${FASES[n]}</span>${team(adv)}<span class="num">${a != null ? fmt(a) + " × " + fmt(o) : "–"}</span></div>`; }).join("")});
  const r1 = M.r1;
  if (r1.participants.includes(id)){
    const i = r1.ranking.findIndex(x => x.id === id), x = r1.ranking[i];
    out.push({k:"resta1", nome:"Resta 1", won: r1.champion === id,
      st: r1.champion === id ? pill("gold","Campeão") : r1.done && i === 1 ? pill("gold","Vice") : x.alive ? pill("live","Vivo") : pill("", "Eliminado na R" + x.r),
      t2: x.alive ? `${r1.alive.length} times ainda vivos` : `${i + 1}º lugar · ${fmt(x.p)} pts na rodada da eliminação`});
  }
  const L = M.hr.started && M.hr.ids.includes(id) ? M.hr : M.bk.started && M.bk.ids.includes(id) ? M.bk : null;
  if (L){
    const nome = L === M.hr ? "Hard Reset" : "Backup", row = L.table.find(x => x.id === id);
    out.push({k: L === M.hr ? "hardreset" : "backup", nome, won: L.done && row.pos <= 4,
      st: L.done ? (row.pos === 1 ? pill("gold","Campeão") : row.pos <= 4 ? pill("gold", row.pos + "º lugar") : pill("", row.pos + "º lugar")) : pill("live", row.pos + "º lugar"),
      t2: `${row.PG} pts em ${row.J} jogos · ${row.V}V ${row.E}E ${row.D}D · saldo ${fmtS(row.SG)}`});
  }
  const fb = M.fb, noFB = [fb.s1, fb.s2].find(m => m.a === id || m.b === id);
  if (noFB){
    const fin = [fb.f, fb.t].find(m => m.a === id || m.b === id);
    out.push({k:"finalboss", nome:"Final Boss", won: fb.f.w === id,

      t2: "Classificado como campeão"});
  }
  const s = M.sup.table.find(x => x.id === id);
  out.push({k:"supremo", nome:"Reset Supremo", won: M.sup.done && s.pos === 1, st: M.sup.done ? (s.pos === 1 ? pill("gold","Campeão") : "") : pill("live", s.pos + "º lugar"),
    t2: `${s.pos}º de 32 · ${fmt(s.pts)} pts` + (s.pos > 1 ? ` · ${fmt(M.sup.table[0].pts - s.pts)} atrás do líder` : "")});
  return out;
}
function chartTime(pf){
  const W = 760, H = 240, ml = 36, mr = 8, mt = 22, mb = 26, pw = W - ml - mr, ph = H - mt - mb, N = TOTAL_RODADAS, bw = pw / N;
  const maxV = Math.max(120, ...pf.rounds.map(x => Math.max(x.p || 0, x.avg)));
  const top = Math.ceil(maxV / 25) * 25, y = v => mt + ph - (v / top) * ph, base = mt + ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pontuação por rodada"><g class="grid">`;
  for (let v = 0; v <= top; v += 50) s += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  s += `</g>`;
  pf.rounds.forEach(x => {
    if (x.p == null || x.p <= 0) return;
    const x0 = ml + (x.r - 1) * bw + 1, w = Math.max(2, bw - 2), y0 = y(x.p), rr = Math.min(4, w / 2, base - y0);
    s += `<path class="bar" data-bar="${x.r}" d="M${x0},${base} V${y0 + rr} Q${x0},${y0} ${x0 + rr},${y0} H${x0 + w - rr} Q${x0 + w},${y0} ${x0 + w},${y0 + rr} V${base} Z"/>`;
  });
  const pts = pf.rounds.map(x => `${ml + (x.r - 0.5) * bw},${y(x.avg)}`).join(" ");
  if (pf.rounds.length > 1) s += `<polyline class="avg" points="${pts}"/>`;
  [pf.best, pf.worst].forEach((x, i) => { if (x) s += `<text class="lbl" x="${ml + (x.r - 0.5) * bw}" y="${y(x.p) - 6}" text-anchor="middle">${i === 0 ? "▲ " : "▼ "}${fmt(x.p)}</text>`; });
  for (let r = 1; r <= N; r++) if (r === 1 || r % 5 === 0 || r === N) s += `<text x="${ml + (r - 0.5) * bw}" y="${H - 8}" text-anchor="middle">${r}</text>`;
  pf.rounds.forEach((x, i) => { s += `<rect class="hit" data-i="${i}" x="${ml + (x.r - 1) * bw}" y="${mt}" width="${bw}" height="${ph}"/>`; });
  return s + `</svg>`;
}

const byName = () => { const m = new Map(); D.times.forEach(t => m.set(norm(t.nome), t.id)); return m; };
function norm(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim(); }
function parsePaste(txt){
  const ids = new Set(D.times.map(t => t.id)), names = byName();
  const res = new Map(), unknown = [];
  for (const line of txt.split(/\r?\n/)){
    if (!line.trim()) continue;
    let cells = line.split("\t");
    if (cells.length < 2) cells = line.split(";");
    if (cells.length < 2) cells = line.trim().split(/\s{2,}/);
    cells = cells.map(c => c.trim());
    let id = null;
    for (const c of cells) if (/^\d+$/.test(c) && ids.has(+c)){ id = +c; break; }
    if (id == null) for (const c of cells){ const x = names.get(norm(c)); if (x){ id = x; break; } }
    let pts = null;
    for (let i = cells.length-1; i >= 0; i--){
      const c = cells[i].replace(/\s/g, "");
      if (/^-?\d+([.,]\d+)?$/.test(c) && !(id != null && +c === id)){ pts = parseFloat(c.replace(",", ".")); break; }
    }
    if (id != null && pts != null) res.set(id, Math.round(pts*100)/100);
    else if (!/rodada|timeid|pontos/i.test(line)) unknown.push(line);
  }
  return {res, unknown};
}

async function importarXlsx(file){
  toast("Lendo planilha…");
  if (!window.XLSX){
    await new Promise((ok, err) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = () => err(new Error("Sem conexão para carregar o leitor de planilhas")); document.head.appendChild(s); });
  }
  const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
  const sn = wb.SheetNames.find(n => norm(n) === "pontuacao") || wb.SheetNames.find(n => /pontua/i.test(norm(n)));
  if (!sn) throw new Error("Aba Pontuação não encontrada");
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
  const hi = rows.findIndex(r => r && r.some(c => norm(c) === "rodada") && r.some(c => norm(c) === "timeid"));
  if (hi < 0) throw new Error("Cabeçalho Rodada/timeId não encontrado");
  const h = rows[hi].map(norm);
  const cR = h.indexOf("rodada"), cI = h.indexOf("timeid"), cP = h.lastIndexOf("pontos");
  const ids = new Set(D.times.map(t => t.id));
  const out = {};
  for (const r of rows.slice(hi+1)){
    if (!r) continue;
    const rd = parseInt(r[cR]), id = parseInt(r[cI]);
    let p = r[cP]; if (typeof p === "string") p = parseFloat(p.replace(",", "."));
    if (!rd || !ids.has(id) || p == null || isNaN(p)) continue;
    (out[rd] = out[rd] || {})[id] = Math.round(p*100)/100;
  }
  const n = Object.keys(out).length;
  if (!n) throw new Error("Nenhuma pontuação encontrada");
  let changed = 0;
  for (const [rd, m] of Object.entries(out)){
    if (JSON.stringify(m) !== JSON.stringify((BASE.pontuacoes || {})[rd] || null)){ LOCAL.pontuacoes[rd] = m; changed++; }
    else delete LOCAL.pontuacoes[rd];
  }
  saveLocal(); refresh();
  toast(`${n} rodadas lidas · ${changed} com novidades`);
}

function baixar(){
  const data = JSON.parse(JSON.stringify(D));
  data.atualizadoEm = new Date().toISOString();
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  const html = SOURCE.replace(/(<script id="liga-dados" type="application\/json">)[\s\S]*?(<\/script>)/, (_, a, b) => a + json + b);
  const blob = new Blob([html], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (D.nome || "Liga") + ".html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Arquivo gerado — substitua o HTML antigo por ele");
}

function drawMain(){
  const t = tab();
  $("#main").innerHTML = `<div class="fade">${(t === "admin" ? V.atualizar : V[t])()}</div>`;
  ajustaArvore();
}
function ajustaArvore(){
  const w = document.getElementById("treewrap"), h = document.getElementById("bkhint");
  if (!w || !h) return;
  const atualiza = () => h.classList.toggle("on", w.offsetParent !== null && w.scrollWidth - w.clientWidth > 4 && w.scrollLeft + w.clientWidth < w.scrollWidth - 4);
  w.addEventListener("scroll", atualiza, {passive:true});
  atualiza();
  w.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button !== 0) return; DRAG = {w, x0: e.clientX, s0: w.scrollLeft}; w.classList.add("drag"); });
}
let DRAG = null;
window.addEventListener("pointermove", e => { if (DRAG) DRAG.w.scrollLeft = DRAG.s0 - (e.clientX - DRAG.x0); });
window.addEventListener("pointerup", () => { if (DRAG){ DRAG.w.classList.remove("drag"); DRAG = null; } });
window.addEventListener("resize", () => { clearTimeout(ajustaArvore._t); ajustaArvore._t = setTimeout(() => { const h = document.getElementById("bkhint"), w = document.getElementById("treewrap"); if (h && w) h.classList.toggle("on", w.offsetParent !== null && w.scrollWidth - w.clientWidth > 4 && w.scrollLeft + w.clientWidth < w.scrollWidth - 4); }, 150); });
function refresh(){
  merge(); M = compute(D);
  document.title = D.nome;
  $("#temp").textContent = "Cartola FC · " + D.temporada;
  $("#mtxt").textContent = `Rodada ${M.last}/${TOTAL_RODADAS}`;
  $("#mbar").style.width = (M.last / TOTAL_RODADAS * 100) + "%";
  $("#mupd").textContent = D.atualizadoEm ? "Atualizado em " + new Date(D.atualizadoEm).toLocaleString("pt-BR", {dateStyle:"short", timeStyle:"short"}) : faseAtual();
  drawSide(); drawMain();
}
refresh();
</script>
</body>
</html>
